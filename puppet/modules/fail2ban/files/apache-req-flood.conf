# Fail2Ban filter: ràfegues de peticions a Apache o nginx
#
# Una coincidència per cada petició no estàtica d'un access_log en format
# combined (el d'Apache i el per defecte d'nginx). El jail decideix què és
# una ràfega (maxretry dins de findtime).
# Pensat per a escàners que fan centenars de peticions per minut i obliguen a
# arrencar PHP a cada una.
#
# Els estàtics no compten: una pàgina en demana desenes, i amb ells una visita
# normal faria saltar el llindar. Només es mira l'extensió del camí, no la de
# la query (/index.php?f=style.css sí que compta).
#
# Les extensions van en minúscules i en majúscules, sense (?i:...): el
# fail2ban de Debian 9 corre sobre Python 3.5, que no accepta flags inline
# amb abast. Una extensió amb majúscules barrejades (.Jpg) compta com a
# dinàmica.
#
# El passthru del plugin Converter for Media tampoc compta: sense regles de
# rewrite (nginx) serveix cada imatge per PHP, i una pàgina en fa centenars.
#
# Les miniatures de l'admin del CMS Directus (/_/assets/<id>?key=...) tampoc: no
# porten extensió, i un llistat del CMS en demana un centenar en un segon.
#
# 192.0.2.10 - - [10/Oct/2026:10:37:24 +0200] "GET /?page_id=1 HTTP/1.1" 200 1234 "-" "Mozilla/5.0"

[Definition]
failregex = ^<HOST> -.*"(?:GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH) (?![^\s?]+\.(?:css|js|png|jpe?g|gif|svg|woff2?|ttf|eot|ico|webp|avif|mp4|map|CSS|JS|PNG|JPE?G|GIF|SVG|WOFF2?|TTF|EOT|ICO|WEBP|AVIF|MP4|MAP)(?:\?\S*)? )\S+ HTTP/
ignoreregex = "GET /wp-content/webpc-passthru\.php\?
              "GET /_/assets/
